name: 06 - Contexts
run-name: 06 - Contexts | DEBUG - ${{ inputs.debug }}

on: 
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false


env:                
    MY_WORKFLOW_VAR: 'workflow'
    MY_OVERWRITTEN_VAR: 'workflow'
jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: 'job'
            MY_OVERWRITTEN_VAR: 'job'
        steps:
            - name: Display Information
              run: |
                echo "Event name: ${{ github.event_name }}"
                echo "RRef: ${{ github.ref }}"
                echo "SHA: ${{ github.sha }}"
                echo "Actor: ${{ github.actor }}"
                echo "Workflow: ${{ github.workflow }}"
                echo "Run ID: ${{ github.run_id }}"
                echo "Run Number: ${{ github.run_number }}"

            - name: Retrieve Variable
              run: |
                echo "Variable value: ${{ vars.MY_VAR }}"
            - name: Print Env Variables
              env:
                MY_OVERWRITTEN_VAR: 'step'
              run: |
                echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
            - name: Print Env Variables
              run: |
                echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
                echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"

    echo-data2:
        runs-on: ubuntu-latest
        steps:
            - name: Print Env Variables
              run: |
                echo "Workflow env: $MY_WORKFLOW_VAR"
                echo "Overwritten env: $MY_OVERWRITTEN_VAR"

    notify:
        runs-on: ubuntu-latest
        needs: [echo-data, echo-data2]
        if: always()
        permissions: {}
        steps:
            - name: Determine workflow status
              id: status
              run: |
                if [[ "$echo_data" == "failure" || "$echo_data" == "cancelled" || "$echo_data" == "skipped" || \
                      "$echo_data2" == "failure" || "$echo_data2" == "cancelled" || "$echo_data2" == "skipped" ]]; then
                  echo "result=Failed" >> $GITHUB_OUTPUT
                else
                  echo "result=Success" >> $GITHUB_OUTPUT
                fi
              env:
                echo_data: ${{ needs.echo-data.result }}
                echo_data2: ${{ needs.echo-data2.result }}

            - name: Send email notification via Resend
              env:
                RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
              run: |
                curl --fail -sS -X POST https://api.resend.com/emails \
                # curl -sS -X POST https://api.resend.com/emails \
                  -H "Authorization: Bearer $RESEND_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "from": "onboarding@resend.dev",
                    "to": ["klemens.wolfgruber@elkb.de"],
                    "subject": "Workflow ${{ github.workflow }} #${{ github.run_number }} -- ${{ steps.status.outputs.result }}",
                    "html": "<h2>Workflow Run Notification</h2><table><tr><td><strong>Status</strong></td><td>${{ steps.status.outputs.result }}</td></tr><tr><td><strong>Workflow</strong></td><td>${{ github.workflow }}</td></tr><tr><td><strong>Repository</strong></td><td>${{ github.repository }}</td></tr><tr><td><strong>Branch / Ref</strong></td><td>${{ github.ref }}</td></tr><tr><td><strong>Run ID</strong></td><td>${{ github.run_id }}</td></tr><tr><td><strong>Run Number</strong></td><td>${{ github.run_number }}</td></tr><tr><td><strong>Link</strong></td><td><a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a></td></tr></table>"
                  }'

